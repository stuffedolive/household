<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- design tokens ---------- */
const C = {
  ink: "#2B2A28", inkSoft: "#5C574C", parchment: "#EDE7D8", card: "#F8F5EC",
  rule: "#D9D0BC", sage: "#6E7B5E", sageDeep: "#4F5A43", plum: "#7A3B45",
  mustard: "#B5842A", white: "#FFFDF8",
};
const PEOPLE = { jade: "Jade", john: "John" };
const PERSON_COLOR = { jade: C.sage, john: C.plum };
const PERSON_CODE = { jade: "JC", john: "JE" };

const BUCKETS = [{ key: "quick", label: "Quick" }, { key: "mid", label: "Middle-term" }, { key: "long", label: "Long-term" }];
const DEFAULT_ROOMS = ["Kitchen", "Bathroom", "Living", "Bedroom", "Laundry", "General"];
const DEFAULT_CATEGORIES = ["General"];
const RECUR_UNITS = [["none", "Never"], ["day", "Days"], ["week", "Weeks"], ["month", "Months"]];
const IMPORTANCE = [
  { key: "high", label: "High", color: C.plum }, { key: "med", label: "Med", color: C.mustard }, { key: "low", label: "Low", color: C.sage },
];

const uid = () => Math.random().toString(36).slice(2, 10);
const nextAction = (task) => (task.actions || []).find((a) => !a.completed) || null;
const actionsProgress = (task) => {
  const acts = task.actions || [];
  if (!acts.length) return null;
  return `${acts.filter((a) => a.completed).length}/${acts.length} actions`;
};
const moveAction = (actions, idx, dir) => {
  const arr = actions.slice();
  const j = idx + dir;
  if (j < 0 || j >= arr.length) return arr;
  [arr[idx], arr[j]] = [arr[j], arr[idx]];
  return arr;
};
/* normalize both the new {unit, amount, mode} shape and the old fixed-string shape from earlier versions */
function normRecurrence(r) {
  if (!r) return { unit: "none", amount: 1, mode: "rolling" };
  if (typeof r === "string") {
    const map = { none: ["none", 1], daily: ["day", 1], weekly: ["week", 1], fortnightly: ["week", 2], monthly: ["month", 1] };
    const [unit, amount] = map[r] || ["none", 1];
    return { unit, amount, mode: "rolling" };
  }
  return { unit: r.unit || "none", amount: r.amount || 1, mode: r.mode || "rolling" };
}
function recurrenceLabel(rec) {
  const r = normRecurrence(rec);
  if (r.unit === "none") return null;
  const unitWord = r.amount === 1 ? r.unit : `${r.unit}s`;
  return `every ${r.amount} ${unitWord}${r.mode === "fixed" ? " · fixed" : ""}`;
}
function addInterval(dateStr, unit, amount) {
  const d = new Date(dateStr + "T00:00:00");
  if (unit === "day") d.setDate(d.getDate() + amount);
  else if (unit === "week") d.setDate(d.getDate() + amount * 7);
  else if (unit === "month") d.setMonth(d.getMonth() + amount);
  return d.toISOString().slice(0, 10);
}
function fmtDate(dateStr) {
  if (!dateStr) return "No date";
  const d = new Date(dateStr + "T00:00:00");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  if (diff === -1) return "Yesterday";
  if (diff < 0) return `${-diff}d overdue`;
  const base = d.toLocaleDateString("en-AU", { day: "numeric", month: "short" });
  if (diff >= 2 && diff <= 14) return `${base} (${diff}d)`;
  return base;
}
/* ensure every room/category actually in use gets a column, and always include a permanent "Unassigned" catch-all */
function withOrphans(sections, tasks, field) {
  const used = new Set(tasks.map((t) => t[field]).filter(Boolean));
  const extra = [...used].filter((v) => !sections.includes(v) && v !== "Unassigned");
  return [...sections, ...extra, "Unassigned"];
}

const TASKS_COLLECTION = "tasks";
const CONFIG_DOC = db.collection("meta").doc("config");
const TODAY_COLLECTION = "today";
const HOUSEHOLD_EMAIL = "access@household-ledger.local";

function sanitizeList(arr, fallback) {
  const clean = [...new Set((arr || []).map((s) => String(s).trim()).filter(Boolean))];
  return clean.length ? clean : fallback;
}

function App() {
  const [authReady, setAuthReady] = useState(null);
  const [me, setMe] = useState(null);
  const [tasks, setTasks] = useState(null);
  const [config, setConfig] = useState({ rooms: DEFAULT_ROOMS, sharedCategories: DEFAULT_CATEGORIES, personalCategories: { jade: DEFAULT_CATEGORIES, john: DEFAULT_CATEGORIES } });
  const [view, setView] = useState("grid");
  const [showNeedsDetails, setShowNeedsDetails] = useState(false);
  const [filter, setFilter] = useState("all");
  const [choreFilter, setChoreFilter] = useState("all");
  const [projectScope, setProjectScope] = useState("shared");
  const [projectFilter, setProjectFilter] = useState("all");
  const [typeFilter, setTypeFilter] = useState("chore");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [pickerFor, setPickerFor] = useState(null);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const u = params.get("user");
    if (u && PEOPLE[u]) setMe(u);
  }, []);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((user) => {
      if (user && user.email === HOUSEHOLD_EMAIL) setAuthReady(true);
      else if (user) { auth.signOut(); setAuthReady(false); }
      else setAuthReady(false);
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (authReady !== true) return;
    const unsub = db.collection(TASKS_COLLECTION).onSnapshot(
      (snap) => setTasks(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      (err) => { console.error("sync error", err); setTasks([]); }
    );
    return unsub;
  }, [authReady]);

  const [configError, setConfigError] = useState(false);
  useEffect(() => {
    if (authReady !== true) return;
    const unsub = CONFIG_DOC.onSnapshot(
      (doc) => {
        setConfigError(false);
        const d = doc.data() || {};
        // fold in anything from the brief unified-categories period so nothing already created gets lost
        const unifiedExtras = sanitizeList(d.categories, []);
        setConfig({
          rooms: sanitizeList(d.rooms, DEFAULT_ROOMS),
          sharedCategories: sanitizeList([...(d.sharedCategories || []), ...unifiedExtras], DEFAULT_CATEGORIES),
          personalCategories: {
            jade: sanitizeList([...((d.personalCategories && d.personalCategories.jade) || []), ...unifiedExtras], DEFAULT_CATEGORIES),
            john: sanitizeList([...((d.personalCategories && d.personalCategories.john) || []), ...unifiedExtras], DEFAULT_CATEGORIES),
          },
        });
      },
      (err) => { console.error("config sync error — likely a Firestore rules issue on /meta/config:", err); setConfigError(true); }
    );
    return unsub;
  }, [authReady]);

  const addRoom = (name) => CONFIG_DOC.set({ rooms: firebase.firestore.FieldValue.arrayUnion(name) }, { merge: true }).catch(console.error);
  const addCategory = (scope, owner, name) => {
    if (scope === "shared") CONFIG_DOC.set({ sharedCategories: firebase.firestore.FieldValue.arrayUnion(name) }, { merge: true }).catch(console.error);
    else CONFIG_DOC.set({ [`personalCategories.${owner}`]: firebase.firestore.FieldValue.arrayUnion(name) }, { merge: true }).catch(console.error);
  };
  const deleteRoom = (name) => {
    CONFIG_DOC.update({ rooms: firebase.firestore.FieldValue.arrayRemove(name) }).catch((e) => console.error("delete room failed", e));
    (tasks || []).filter((t) => t.room === name).forEach((t) => db.collection(TASKS_COLLECTION).doc(t.id).update({ room: null }).catch(console.error));
  };
  const deleteCategory = (scope, owner, name) => {
    if (scope === "shared") {
      CONFIG_DOC.update({ sharedCategories: firebase.firestore.FieldValue.arrayRemove(name) }).catch((e) => console.error("delete category failed", e));
      (tasks || []).filter((t) => t.scope === "shared" && t.category === name).forEach((t) => db.collection(TASKS_COLLECTION).doc(t.id).update({ category: null }).catch(console.error));
    } else {
      CONFIG_DOC.update({ [`personalCategories.${owner}`]: firebase.firestore.FieldValue.arrayRemove(name) }).catch((e) => console.error("delete category failed", e));
      (tasks || []).filter((t) => t.scope === "personal" && t.owner === owner && t.category === name).forEach((t) => db.collection(TASKS_COLLECTION).doc(t.id).update({ category: null }).catch(console.error));
    }
  };
  const reorderList = (list, name, dir) => {
    const idx = list.indexOf(name);
    if (idx < 0) return null;
    const j = idx + dir;
    if (j < 0 || j >= list.length) return null;
    const arr = list.slice();
    [arr[idx], arr[j]] = [arr[j], arr[idx]];
    return arr;
  };
  const reorderRoom = (name, dir) => {
    const arr = reorderList(config.rooms, name, dir);
    if (arr) CONFIG_DOC.update({ rooms: arr }).catch(console.error);
  };
  const reorderCategory = (scope, owner, name, dir) => {
    const list = scope === "shared" ? config.sharedCategories : config.personalCategories[owner];
    const arr = reorderList(list, name, dir);
    if (!arr) return;
    if (scope === "shared") CONFIG_DOC.update({ sharedCategories: arr }).catch(console.error);
    else CONFIG_DOC.update({ [`personalCategories.${owner}`]: arr }).catch(console.error);
  };

  /* Today's plan — private per person: sundry one-off items + references to real tasks, one combined
     reorderable list. Lives in its own doc per person so it never becomes visible to the other partner. */
  const [todayItems, setTodayItems] = useState([]);
  useEffect(() => {
    if (authReady !== true || !me) return;
    const unsub = db.collection(TODAY_COLLECTION).doc(me).onSnapshot(
      (doc) => setTodayItems((doc.data() && doc.data().items) || []),
      (err) => console.error("today sync error — check Firestore rules cover /today/{docId}:", err)
    );
    return unsub;
  }, [authReady, me]);
  const saveToday = (items) => db.collection(TODAY_COLLECTION).doc(me).set({ items }, { merge: true }).catch(console.error);
  const addSundry = (title) => saveToday([...todayItems, { type: "sundry", id: uid(), title: title.trim(), completed: false }]);
  const toggleSundry = (id) => saveToday(todayItems.map((it) => (it.id === id ? { ...it, completed: !it.completed } : it)));
  const deleteSundry = (id) => saveToday(todayItems.filter((it) => it.id !== id));
  const addTaskToToday = (taskId) => {
    if (todayItems.some((it) => it.type === "task" && it.id === taskId)) return;
    saveToday([...todayItems, { type: "task", id: taskId }]);
  };
  const removeTaskFromToday = (taskId) => saveToday(todayItems.filter((it) => !(it.type === "task" && it.id === taskId)));
  const reorderToday = (idx, dir) => {
    const j = idx + dir;
    if (j < 0 || j >= todayItems.length) return;
    const arr = todayItems.slice();
    [arr[idx], arr[j]] = [arr[j], arr[idx]];
    saveToday(arr);
  };
  const resetToday = () => saveToday([]);

  const upsertTask = (task) => {
    const { id, ...data } = task;
    db.collection(TASKS_COLLECTION).doc(id).set({ ...data, updatedAt: Date.now() }).catch((e) => console.error("save failed", e));
  };
  const deleteTask = (id) => db.collection(TASKS_COLLECTION).doc(id).delete().catch((e) => console.error(e));

  const toggleComplete = (task) => {
    const ref = db.collection(TASKS_COLLECTION).doc(task.id);
    const rec = normRecurrence(task.recurrence);
    if (!task.completed && rec.unit !== "none" && task.dueDate) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const base = rec.mode === "fixed" ? task.dueDate : todayStr;
      const nextDue = addInterval(base, rec.unit, rec.amount);
      ref.update({ dueDate: nextDue, completed: false, completedAt: null }).catch(console.error);
    } else {
      const nowCompleting = !task.completed;
      ref.update({ completed: nowCompleting, completedAt: nowCompleting ? Date.now() : null }).catch(console.error);
    }
  };

  const updateActions = (taskId, actions) => db.collection(TASKS_COLLECTION).doc(taskId).update({ actions }).catch(console.error);
  const toggleAction = (taskId, actionId) => {
    const task = tasks.find((t) => t.id === taskId);
    if (!task) return;
    updateActions(taskId, (task.actions || []).map((a) => (a.id === actionId ? { ...a, completed: !a.completed } : a)));
  };
  const addAction = (taskId, title) => {
    if (!title.trim()) return;
    const task = tasks.find((t) => t.id === taskId);
    if (!task) return;
    updateActions(taskId, [...(task.actions || []), { id: uid(), title: title.trim(), completed: false, dueDate: null }]);
  };
  const deleteAction = (taskId, actionId) => {
    const task = tasks.find((t) => t.id === taskId);
    if (!task) return;
    updateActions(taskId, (task.actions || []).filter((a) => a.id !== actionId));
  };
  const reorderAction = (taskId, actionId, dir) => {
    const task = tasks.find((t) => t.id === taskId);
    if (!task) return;
    const idx = (task.actions || []).findIndex((a) => a.id === actionId);
    if (idx < 0) return;
    updateActions(taskId, moveAction(task.actions || [], idx, dir));
  };
  const setActionDueDate = (taskId, actionId, date) => {
    const task = tasks.find((t) => t.id === taskId);
    if (!task) return;
    updateActions(taskId, (task.actions || []).map((a) => (a.id === actionId ? { ...a, dueDate: date || null } : a)));
  };
  const setTaskDueDate = (taskId, date) => db.collection(TASKS_COLLECTION).doc(taskId).update({ dueDate: date }).catch(console.error);

  /* scope-aware: pinning a task only clears the previous occupant of that slot
     if the previous occupant was pinned from the SAME scope (personal vs shared) — personal and
     shared pins for the same person+bucket are independent of each other. */
  const setBucket = (taskId, person, bucket, scope) => {
    db.collection(TASKS_COLLECTION).doc(taskId).update({ [`gridBucket.${person}`]: bucket }).catch(console.error);
    tasks.forEach((t) => {
      if (t.id !== taskId && t.scope === scope && t.gridBucket && t.gridBucket[person] === bucket) {
        db.collection(TASKS_COLLECTION).doc(t.id).update({ [`gridBucket.${person}`]: firebase.firestore.FieldValue.delete() }).catch(console.error);
      }
    });
  };
  const clearBucket = (taskId, person) => {
    db.collection(TASKS_COLLECTION).doc(taskId).update({ [`gridBucket.${person}`]: firebase.firestore.FieldValue.delete() }).catch(console.error);
  };

  const visibleTasks = useMemo(() => (tasks || []).filter((t) => t.scope === "shared" || t.owner === me), [tasks, me]);
  const needsDetailsTasks = useMemo(() => (tasks || []).filter((t) => t.needsDetails && t.createdBy === me), [tasks, me]);

  if (authReady === null) return <Shell><div style={centerMsg}>Loading…</div></Shell>;
  if (authReady === false) return <Shell><PinGate /></Shell>;

  if (!me) {
    return (
      <Shell>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100%", gap: 18, padding: 24 }}>
          <div style={{ fontFamily: "Fraunces, serif", fontSize: 26, color: C.ink, textAlign: "center" }}>Who's checking in?</div>
          <div style={{ fontSize: 13, color: C.inkSoft, textAlign: "center", maxWidth: 260 }}>
            Bookmark this page with <code>?user=jade</code> or <code>?user=john</code> on the end of the URL to always land on your view.
          </div>
          <div style={{ display: "flex", gap: 12 }}>
            {Object.entries(PEOPLE).map(([key, label]) => (
              <button key={key} onClick={() => setMe(key)} style={btnStyle(PERSON_COLOR[key])}>{label}</button>
            ))}
          </div>
        </div>
      </Shell>
    );
  }

  if (tasks === null) return <Shell><div style={centerMsg}>Loading the list…</div></Shell>;

  return (
    <Shell>
      <Header me={me} view={view} setView={setView} needsDetailsCount={needsDetailsTasks.length} onOpenNeedsDetails={() => setShowNeedsDetails(true)} />
      {configError && (
        <div style={{ background: C.plum, color: C.white, fontSize: 11, padding: "6px 16px", textAlign: "center" }}>
          Can't sync sections (rooms/categories) — check your Firestore rules cover /meta/config too.
        </div>
      )}
      {view === "grid" ? (
        <PriorityGrid tasks={tasks} me={me} onOpenPicker={setPickerFor} onClearBucket={clearBucket} onToggleAction={toggleAction} onEditTask={(t) => { setEditing(t); setShowForm(true); }} />
      ) : view === "todo" ? (
        <ToDoList
          tasks={visibleTasks} onToggle={toggleComplete} onEdit={(t) => { setEditing(t); setShowForm(true); }} onDelete={deleteTask}
          onToggleAction={toggleAction} onAddAction={addAction} onDeleteAction={deleteAction} onReorderAction={reorderAction}
          onSetActionDueDate={setActionDueDate} onSetTaskDueDate={setTaskDueDate} me={me}
          todayItems={todayItems} onAddSundry={addSundry} onToggleSundry={toggleSundry} onDeleteSundry={deleteSundry}
          onAddTaskToToday={addTaskToToday} onRemoveTaskFromToday={removeTaskFromToday} onReorderToday={reorderToday} onResetToday={resetToday}
        />
      ) : (
        <QueueView
          tasks={visibleTasks} me={me} filter={filter} setFilter={setFilter}
          choreFilter={choreFilter} setChoreFilter={setChoreFilter}
          projectScope={projectScope} setProjectScope={setProjectScope}
          projectFilter={projectFilter} setProjectFilter={setProjectFilter}
          typeFilter={typeFilter} setTypeFilter={setTypeFilter}
          config={config} onAddRoom={addRoom} onAddCategory={addCategory} onDeleteRoom={deleteRoom} onDeleteCategory={deleteCategory} onReorderRoom={reorderRoom} onReorderCategory={reorderCategory}
          onToggle={toggleComplete} onEdit={(t) => { setEditing(t); setShowForm(true); }} onDelete={deleteTask}
          onToggleAction={toggleAction} onAddAction={addAction} onDeleteAction={deleteAction}
          onReorderAction={reorderAction} onSetActionDueDate={setActionDueDate}
        />
      )}

      <button
        onClick={() => { setEditing(null); setShowForm(true); }}
        style={{ position: "absolute", right: 18, bottom: 22, width: 52, height: 52, borderRadius: "50%", background: C.ink, color: C.white, border: "none", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 6px 16px rgba(43,42,40,0.28)", cursor: "pointer", fontSize: 24 }}
        aria-label="Add task"
      >+</button>

      {showForm && (
        <TaskForm
          me={me} initial={editing} config={config} onAddRoom={addRoom} onAddCategory={addCategory}
          onClose={() => setShowForm(false)} onSave={(t) => { upsertTask(t); setShowForm(false); }}
          onDelete={(id) => { deleteTask(id); setShowForm(false); }}
        />
      )}
      {showNeedsDetails && (
        <NeedsDetailsList
          tasks={needsDetailsTasks}
          onClose={() => setShowNeedsDetails(false)}
          onPick={(t) => { setEditing(t); setShowForm(true); setShowNeedsDetails(false); }}
        />
      )}
      {pickerFor && (
        <BucketPicker
          tasks={tasks.filter((t) =>
            t.listType === "project" && !t.completed &&
            (pickerFor.scope === "shared"
              ? t.scope === "shared" && (t.assignee === pickerFor.person || !t.assignee)
              : t.scope === "personal" && t.owner === pickerFor.person) &&
            (!t.priorityBucket || t.priorityBucket === pickerFor.bucket)
          )}
          onPick={(taskId) => { setBucket(taskId, pickerFor.person, pickerFor.bucket, pickerFor.scope); setPickerFor(null); }}
          onClose={() => setPickerFor(null)}
        />
      )}
    </Shell>
  );
}

const centerMsg = { display: "flex", alignItems: "center", justifyContent: "center", height: "100%", color: "#5C574C", fontFamily: "Fraunces, serif" };

/* ---------- PIN gate ---------- */
function PinGate() {
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = () => {
    if (!pin.trim() || busy) return;
    setBusy(true); setError("");
    auth.signInWithEmailAndPassword(HOUSEHOLD_EMAIL, pin)
      .catch(() => setError("Wrong PIN — try again."))
      .finally(() => setBusy(false));
  };
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100%", gap: 14, padding: 24 }}>
      <div style={{ fontFamily: "Fraunces, serif", fontSize: 24, color: C.ink, textAlign: "center" }}>Enter the household PIN</div>
      <input type="password" inputMode="numeric" autoFocus value={pin} onChange={(e) => setPin(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
        style={{ ...inputStyle, width: 200, textAlign: "center", letterSpacing: 4, fontSize: 18 }} />
      {error && <div style={{ color: C.plum, fontSize: 12.5 }}>{error}</div>}
      <button onClick={submit} disabled={busy || !pin.trim()} style={{ ...btnStyle(C.ink), opacity: busy || !pin.trim() ? 0.5 : 1 }}>{busy ? "Checking…" : "Unlock"}</button>
    </div>
  );
}

/* ---------- shell ---------- */
function Shell({ children }) {
  return <div style={{ position: "relative", width: "100%", maxWidth: 480, margin: "0 auto", height: "100vh", background: C.parchment, fontFamily: "Inter, sans-serif", overflow: "hidden" }}>{children}</div>;
}
function btnStyle(bg) { return { padding: "12px 22px", borderRadius: 10, border: "none", background: bg, color: C.white, fontSize: 15, fontWeight: 600, cursor: "pointer" }; }

function Header({ me, view, setView, needsDetailsCount, onOpenNeedsDetails }) {
  return (
    <div style={{ padding: "18px 18px 10px", borderBottom: `1px solid ${C.rule}` }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>

/* ---------- to-do list: a simple first pass — urgent/pressing items across everything visible to me ---------- */
const DAY_MS = 86400000;
const SOON_DAYS = 3; // "due soon" window
const STALE_DAYS_DEFAULT = 60; // fallback for one-off (non-recurring) tasks
const LINGER_MS = 24 * 3600 * 1000; // how long a just-completed task stays visible

function urgencyBand(dueDate, todayStr) {
  if (!dueDate) return "none";
  if (dueDate < todayStr) return "overdue";
  const diff = Math.round((new Date(dueDate + "T00:00:00") - new Date(todayStr + "T00:00:00")) / DAY_MS);
  if (diff <= SOON_DAYS) return "soon";
  return "later";
}
/* approximate recurrence period in days, or null for one-off tasks */
function recurrencePeriodDays(rec) {
  const r = normRecurrence(rec);
  if (r.unit === "none") return null;
  if (r.unit === "day") return r.amount;
  if (r.unit === "week") return r.amount * 7;
  if (r.unit === "month") return r.amount * 30;
  return null;
}

/* Strict two-level ranking: high/med importance ALWAYS outranks low/none, with zero exceptions.
   Within that group, urgency (overdue > soon > later) decides order; importance is only a fine tiebreak. */
function tierFor(dueDate, priority, todayStr) {
  const group = (priority === "high" || priority === "med") ? 0 : 1; // 0 = not-low, always first
  const u = urgencyBand(dueDate, todayStr);
  const urgencyRank = u === "overdue" ? 0 : u === "soon" ? 1 : 2;
  const tie = priority === "high" ? 0 : priority === "med" ? 1 : priority === "low" ? 2 : 3;
  return group * 100 + urgencyRank * 10 + tie;
}

/* a compact row representing a project's next action, standing in for the whole project */
function ActionAsRow({ task, action, onToggleAction, onEdit, onSnooze, onAddToToday }) {
  const overdue = action.dueDate && action.dueDate < new Date().toISOString().slice(0, 10);
  const imp = IMPORTANCE.find((x) => x.key === task.priority) || null;
  return (
    <div style={{ background: C.card, border: `1px solid ${C.rule}`, borderRadius: 10, padding: "11px 12px", marginBottom: 8 }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
        <button onClick={() => onToggleAction(task.id, action.id)} style={{ width: 20, height: 20, borderRadius: "50%", border: `2px solid ${imp ? imp.color : C.inkSoft}`, background: "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, marginTop: 1 }} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div onClick={() => onEdit(task)} style={{ cursor: "pointer" }}>
            <div style={{ fontSize: 14, color: C.ink, fontWeight: 600 }}>{action.title}</div>
            <div style={{ fontSize: 11, color: C.inkSoft, marginTop: 2 }}>↳ {task.title}</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 5, alignItems: "center" }}>
              {imp && <Tag color={imp.color}>{imp.label}</Tag>}
              <span style={{ fontSize: 10.5, fontFamily: "IBM Plex Mono, monospace", color: overdue ? C.plum : C.inkSoft, fontWeight: overdue ? 700 : 500 }}>{fmtDate(action.dueDate || task.dueDate)}</span>
            </div>
          </div>
          {onSnooze && <div style={{ marginTop: 6 }}><SnoozeControl onSnooze={onSnooze} /></div>}
        </div>
        {onAddToToday && <button onClick={() => onAddToToday(task.id)} style={{ border: `1px solid ${C.rule}`, background: C.white, color: C.sageDeep, cursor: "pointer", padding: "2px 8px", fontSize: 11, fontWeight: 600, borderRadius: 6, whiteSpace: "nowrap", alignSelf: "flex-start" }}>+ Today</button>}
      </div>
    </div>
  );
}

function snoozeTarget(kind) {
  const d = new Date();
  if (kind === "tomorrow") d.setDate(d.getDate() + 1);
  else if (kind === "next-weekend") {
    const day = d.getDay();
    const diff = (6 - day + 7) % 7 || 7;
    d.setDate(d.getDate() + diff);
  } else if (kind === "next-month") d.setMonth(d.getMonth() + 1);
  return d.toISOString().slice(0, 10);
}
const notStartableYet = (t, todayStr) => t.startsOnDue && t.dueDate && t.dueDate > todayStr;

/* shared "not today" control — used on the hero card and, in overwhelmed mode, on every row */
function SnoozeControl({ onSnooze, light }) {
  const [open, setOpen] = useState(false);
  const textColor = light ? "rgba(255,255,255,0.65)" : C.inkSoft;
  if (!open) {
    return <button onClick={() => setOpen(true)} style={{ background: "none", border: "none", color: textColor, fontSize: 11.5, textDecoration: "underline", cursor: "pointer", padding: 0 }}>Not today</button>;
  }
  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
      {[["tomorrow", "Tomorrow"], ["next-weekend", "Next weekend"], ["next-month", "Next month"]].map(([k, l]) => (
        <button key={k} onClick={() => { onSnooze(k); setOpen(false); }} style={{ background: light ? "rgba(255,255,255,0.14)" : C.card, color: light ? C.white : C.ink, border: light ? "none" : `1px solid ${C.rule}`, borderRadius: 6, padding: "4px 9px", fontSize: 11, cursor: "pointer" }}>{l}</button>
      ))}
    </div>
  );
}

/* prominent hero card for "overwhelmed" mode — visually set apart from everything else */
function HeroCard({ pick, onToggle, onToggleAction, onEdit, onSnooze }) {
  const isChore = pick.kind === "chore";
  const task = isChore ? pick.item : pick.item.task;
  const action = isChore ? null : pick.item.action;
  const title = isChore ? task.title : action.title;
  const dueDate = isChore ? task.dueDate : (action.dueDate || task.dueDate);
  const imp = IMPORTANCE.find((x) => x.key === task.priority) || null;
  return (
    <div style={{ background: C.ink, color: C.white, borderRadius: 20, padding: "30px 24px", textAlign: "center", boxShadow: "0 14px 34px rgba(43,42,40,0.3)", marginBottom: 18 }}>
      <div style={{ fontSize: 10, opacity: 0.55, marginBottom: 10, textTransform: "uppercase", letterSpacing: 1 }}>Most pressing right now</div>
      {!isChore && <div style={{ fontSize: 11, opacity: 0.6, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>from {task.title}</div>}
      {imp && <div style={{ display: "inline-block", fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", background: imp.color, color: C.white, padding: "3px 11px", borderRadius: 20, marginBottom: 14 }}>{imp.label} importance</div>}
      <div style={{ fontFamily: "Fraunces, serif", fontSize: 26, fontWeight: 600, lineHeight: 1.25, marginBottom: 12 }}>{title}</div>
      <div style={{ fontFamily: "IBM Plex Mono, monospace", fontSize: 13, opacity: 0.8, marginBottom: 22 }}>{fmtDate(dueDate)}</div>
      <div style={{ display: "flex", gap: 10, justifyContent: "center", marginBottom: 18 }}>
        <button onClick={() => (isChore ? onToggle(task) : onToggleAction(task.id, action.id))} style={{ background: C.white, color: C.ink, border: "none", borderRadius: 10, padding: "11px 22px", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>Done</button>
        <button onClick={() => onEdit(task)} style={{ background: "transparent", color: C.white, border: "1px solid rgba(255,255,255,0.4)", borderRadius: 10, padding: "11px 18px", fontSize: 14, cursor: "pointer" }}>Open</button>
      </div>
      <div style={{ display: "flex", justifyContent: "center" }}><SnoozeControl onSnooze={onSnooze} light /></div>
    </div>
  );
}

function upcomingLeadDays(periodDays) {
  if (periodDays >= 300) return 30; // yearly-ish
  if (periodDays >= 150) return 14; // ~6-monthly
  if (periodDays >= 7) return 3;   // weekly through ~5-monthly
  return 1;                          // more frequent than weekly
}

function ToDoList({
  tasks, me, onToggle, onEdit, onDelete, onToggleAction, onAddAction, onDeleteAction, onReorderAction, onSetActionDueDate, onSetTaskDueDate,
  todayItems, onAddSundry, onToggleSundry, onDeleteSundry, onAddTaskToToday, onRemoveTaskFromToday, onReorderToday, onResetToday,
}) {
  const [overwhelmed, setOverwhelmed] = useState(false);
  const today = new Date().toISOString().slice(0, 10);
  const now = Date.now();

  const assignedToMe = useMemo(() => tasks.filter((t) =>
    t.scope === "personal" ? t.owner === me : (t.assignee === me || !t.assignee)
  ), [tasks, me]);

  const justDone = useMemo(() => assignedToMe
    .filter((t) => t.completed && t.completedAt && (now - t.completedAt < LINGER_MS))
    .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0)),
    [assignedToMe, now]
  );

  // upcoming: recurring, "due date is start date" tasks approaching their window — computed before the
  // not-startable-yet exclusion below, since this IS how those tasks get any visibility before they're due
  const upcoming = useMemo(() => assignedToMe.filter((t) => {
    if (t.completed || !t.startsOnDue || !t.dueDate || t.dueDate <= today) return false;
    const period = recurrencePeriodDays(t.recurrence);
    if (!period) return false;
    const daysUntil = Math.round((new Date(t.dueDate + "T00:00:00") - new Date(today + "T00:00:00")) / DAY_MS);
    return daysUntil <= upcomingLeadDays(period);
  }).sort((a, b) => a.dueDate.localeCompare(b.dueDate)), [assignedToMe, today]);

  const active = useMemo(() => assignedToMe.filter((t) => !t.completed && !notStartableYet(t, today)), [assignedToMe, today]);

  // stale: low/no importance only, overdue by more than half its recurrence period (60 days for one-off tasks)
  const stale = useMemo(() => active.filter((t) => {
    if (!t.dueDate || !(t.priority === "low" || !t.priority)) return false;
    const daysOverdue = Math.round((new Date(today + "T00:00:00") - new Date(t.dueDate + "T00:00:00")) / DAY_MS);
    const period = recurrencePeriodDays(t.recurrence);
    const threshold = period ? period * 0.5 : STALE_DAYS_DEFAULT;
    return daysOverdue > threshold;
  }), [active, today]);
  const staleIds = new Set(stale.map((t) => t.id));

  // chores: dated, not stale, ranked by tier
  const chores = useMemo(() => active
    .filter((t) => t.listType === "chore" && t.dueDate && !staleIds.has(t.id))
    .sort((a, b) => {
      const ta = tierFor(a.dueDate, a.priority, today), tb = tierFor(b.dueDate, b.priority, today);
      if (ta !== tb) return ta - tb;
      return a.dueDate.localeCompare(b.dueDate);
    }), [active, today, staleIds]
  );

  // projects: only ones pinned in the Priorities grid for the viewed person — their first/next action always
  // shows, even with no priority or due date of its own (falls back to the project's own date, or no date at all)
  const projectItems = useMemo(() => {
    const items = active
      .filter((t) => t.listType === "project" && t.gridBucket && t.gridBucket[me] && !staleIds.has(t.id))
      .map((t) => ({ task: t, action: nextAction(t) }))
      .filter(({ action }) => !!action);
    return items.sort((a, b) => {
      const da = a.action.dueDate || a.task.dueDate, db = b.action.dueDate || b.task.dueDate;
      const ta = tierFor(da, a.task.priority, today), tb = tierFor(db, b.task.priority, today);
      if (ta !== tb) return ta - tb;
      return (da || "9999").localeCompare(db || "9999");
    });
  }, [active, me, today, staleIds]);

  const rowProps = { me, onToggle, onEdit, onDelete, onToggleAction, onAddAction, onDeleteAction, onReorderAction, onSetActionDueDate };

  // the single most urgent thing across chores + project actions, for the overwhelmed spotlight
  const topPick = useMemo(() => {
    const choreTop = chores[0] ? { kind: "chore", tier: tierFor(chores[0].dueDate, chores[0].priority, today), item: chores[0] } : null;
    const projTop = projectItems[0] ? { kind: "project", tier: tierFor(projectItems[0].action.dueDate || projectItems[0].task.dueDate, projectItems[0].task.priority, today), item: projectItems[0] } : null;
    const candidates = [choreTop, projTop].filter(Boolean);
    if (!candidates.length) return null;
    candidates.sort((a, b) => a.tier - b.tier);
    return candidates[0];
  }, [chores, projectItems, today]);

  const snoozeChore = (task, kind) => onSetTaskDueDate(task.id, snoozeTarget(kind));
  const snoozeProjectAction = (task, action, kind) => onSetActionDueDate(task.id, action.id, snoozeTarget(kind));

  const displayChores = overwhelmed && topPick && topPick.kind === "chore" ? chores.filter((t) => t.id !== topPick.item.id) : chores;
  const displayProjects = overwhelmed && topPick && topPick.kind === "project"
    ? projectItems.filter(({ task, action }) => !(task.id === topPick.item.task.id && action.id === topPick.item.action.id))
    : projectItems;

  const todaySelectedTaskIds = new Set(todayItems.filter((it) => it.type === "task").map((it) => it.id));
  const tasksById = useMemo(() => { const m = {}; tasks.forEach((t) => { m[t.id] = t; }); return m; }, [tasks]);

  return (
    <div style={{ height: "calc(100% - 64px)", overflowY: "auto", padding: "14px 16px 90px" }}>
      <button onClick={() => setOverwhelmed((o) => !o)} style={{ width: "100%", border: `1px solid ${C.rule}`, background: overwhelmed ? C.ink : C.card, color: overwhelmed ? C.white : C.inkSoft, borderRadius: 8, padding: "7px 0", fontSize: 12, fontWeight: 600, cursor: "pointer", marginBottom: 12 }}>
        {overwhelmed ? "Turn off overwhelmed mode" : "I'm overwhelmed — highlight the top thing"}
      </button>

      <TodayPlanSection
        items={todayItems} tasksById={tasksById}
        onAddSundry={onAddSundry} onToggleSundry={onToggleSundry} onDeleteSundry={onDeleteSundry}
        onReorder={onReorderToday} onRemoveTask={onRemoveTaskFromToday} onReset={onResetToday}
        onToggle={onToggle} onToggleAction={onToggleAction} onEdit={onEdit}
      />

      {overwhelmed && topPick && (
        <HeroCard pick={topPick} onToggle={onToggle} onToggleAction={onToggleAction} onEdit={onEdit} onSnooze={(kind) => (topPick.kind === "chore" ? snoozeChore(topPick.item, kind) : snoozeProjectAction(topPick.item.task, topPick.item.action, kind))} />
      )}

      {displayChores.length === 0 && displayProjects.length === 0 && justDone.length === 0 && (
        <div style={{ color: C.inkSoft, fontSize: 13, textAlign: "center", marginTop: 40 }}>Nothing pressing right now.</div>
      )}

      {displayChores.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: C.inkSoft, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>Chores</div>
          {displayChores.map((t) => (
            <TaskRow key={t.id} task={t} {...rowProps} onSnooze={overwhelmed ? (kind) => snoozeChore(t, kind) : undefined} onAddToToday={todaySelectedTaskIds.has(t.id) ? undefined : onAddTaskToToday} />
          ))}
        </div>
      )}

      {displayProjects.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: C.inkSoft, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>Projects</div>
          {displayProjects.map(({ task, action }) => (
            <ActionAsRow key={task.id + action.id} task={task} action={action} onToggleAction={onToggleAction} onEdit={onEdit} onSnooze={overwhelmed ? (kind) => snoozeProjectAction(task, action, kind) : undefined} onAddToToday={todaySelectedTaskIds.has(task.id) ? undefined : onAddTaskToToday} />
          ))}
        </div>
      )}

      <CollapsibleSection title="Stale" count={stale.length} defaultOpen={false}>
        <div style={{ fontSize: 11, color: C.inkSoft, marginBottom: 6 }}>Low or no importance, overdue by more than half its usual cycle (or 60+ days for one-off tasks).</div>
        {stale.length === 0 && <div style={{ color: C.inkSoft, fontSize: 12, textAlign: "center", padding: "10px 0" }}>Nothing stale right now.</div>}
        {stale.map((t) => <TaskRow key={t.id} task={t} {...rowProps} />)}
      </CollapsibleSection>

      <CollapsibleSection title="Upcoming" count={upcoming.length} defaultOpen={false}>
        <div style={{ fontSize: 11, color: C.inkSoft, marginBottom: 6 }}>Recurring, can't-start-early tasks whose window is approaching.</div>
        {upcoming.length === 0 && <div style={{ color: C.inkSoft, fontSize: 12, textAlign: "center", padding: "10px 0" }}>Nothing coming up yet.</div>}
        {upcoming.map((t) => <TaskRow key={t.id} task={t} {...rowProps} />)}
      </CollapsibleSection>

      {justDone.length > 0 && (
        <div style={{ marginTop: 18 }}>
          <div style={{ fontSize: 11, color: C.sageDeep, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>Just done ✓</div>
          {justDone.map((t) => <TaskRow key={t.id} task={t} {...rowProps} />)}
        </div>
      )}
    </div>
  );
}


/* compact "Today's plan" — just titles, sits at the top of the list like the hero card does for overwhelmed mode */
function TodayPlanSection({ items, tasksById, onAddSundry, onToggleSundry, onDeleteSundry, onReorder, onRemoveTask, onReset, onToggle, onToggleAction, onEdit }) {
  const [newSundry, setNewSundry] = useState("");
  const [resetting, setResetting] = useState(false);
  const commitSundry = () => { if (newSundry.trim()) { onAddSundry(newSundry.trim()); setNewSundry(""); } };

  return (
    <div style={{ background: C.card, border: `1px solid ${C.rule}`, borderRadius: 12, padding: "14px 14px 10px", marginBottom: 18, minHeight: "calc(100vh - 260px)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <div style={{ fontFamily: "Fraunces, serif", fontSize: 16, color: C.ink }}>Today's plan</div>
        {!resetting ? (
          <button onClick={() => setResetting(true)} style={{ border: `1px solid ${C.plum}`, color: C.plum, background: "none", borderRadius: 8, padding: "4px 10px", fontSize: 10.5, fontWeight: 600, cursor: "pointer" }}>Reset</button>
        ) : (
          <button onClick={() => { onReset(); setResetting(false); }} style={{ border: "none", color: C.white, background: C.plum, borderRadius: 8, padding: "4px 10px", fontSize: 10.5, fontWeight: 700, cursor: "pointer" }}>Confirm?</button>
        )}
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
        <input value={newSundry} onChange={(e) => setNewSundry(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") commitSundry(); }} onBlur={commitSundry} placeholder="Add a sundry…" style={{ ...inputStyle, fontSize: 13, background: C.white }} />
        <button onClick={commitSundry} style={{ border: "none", background: C.sageDeep, color: C.white, borderRadius: 8, padding: "0 14px", cursor: "pointer" }}>+</button>
      </div>

      {items.length === 0 && <div style={{ color: C.inkSoft, fontSize: 12.5, textAlign: "center", padding: "6px 0 4px" }}>Nothing planned yet.</div>}

      {items.map((item, idx) => {
        const task = item.type === "task" ? tasksById[item.id] : null;
        let title, completed, onCheck;
        if (item.type === "sundry") {
          title = item.title; completed = item.completed; onCheck = () => onToggleSundry(item.id);
        } else if (task) {
          if (task.listType === "project") {
            const na = nextAction(task);
            title = na ? na.title : task.title;
            completed = !na && task.completed;
            onCheck = na ? () => onToggleAction(task.id, na.id) : () => onToggle(task);
          } else {
            title = task.title; completed = task.completed; onCheck = () => onToggle(task);
          }
        } else {
          title = "(removed)"; completed = false; onCheck = () => {};
        }
        return (
          <div key={item.type + item.id} style={{ display: "flex", alignItems: "center", gap: 7, padding: "6px 0", borderTop: idx > 0 ? `1px solid ${C.rule}` : "none" }}>
            <button onClick={onCheck} style={{ width: 18, height: 18, borderRadius: "50%", border: `2px solid ${C.sage}`, background: completed ? C.sage : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: C.white, fontSize: 10, flexShrink: 0 }}>{completed && "✓"}</button>
            <span onClick={task ? () => onEdit(task) : undefined} style={{ flex: 1, fontSize: 13.5, color: C.ink, textDecoration: completed ? "line-through" : "none", cursor: task ? "pointer" : "default" }}>{title}</span>
            <button onClick={() => onReorder(idx, -1)} disabled={idx === 0} style={{ border: "none", background: "none", color: idx === 0 ? C.rule : C.inkSoft, cursor: idx === 0 ? "default" : "pointer", fontSize: 11, padding: "0 2px" }}>▲</button>
            <button onClick={() => onReorder(idx, 1)} disabled={idx === items.length - 1} style={{ border: "none", background: "none", color: idx === items.length - 1 ? C.rule : C.inkSoft, cursor: idx === items.length - 1 ? "default" : "pointer", fontSize: 11, padding: "0 2px" }}>▼</button>
            <button onClick={() => (item.type === "sundry" ? onDeleteSundry(item.id) : onRemoveTask(item.id))} style={{ border: "none", background: "none", color: C.inkSoft, cursor: "pointer", fontSize: 12 }}>×</button>
          </div>
        );
      })}
    </div>
  );
}

function QueueView(props) {
  const {
    tasks, me, filter, setFilter, choreFilter, setChoreFilter,
    projectScope, setProjectScope, projectFilter, setProjectFilter,
    typeFilter, setTypeFilter, config, onAddRoom, onAddCategory, onDeleteRoom, onDeleteCategory, onReorderRoom, onReorderCategory,
    onToggle, onEdit, onDelete, onToggleAction, onAddAction, onDeleteAction, onReorderAction, onSetActionDueDate,
  } = props;

  const typed = useMemo(() => (typeFilter === "all" ? tasks : tasks.filter((t) => t.listType === typeFilter)), [tasks, typeFilter]);

  const scoped = useMemo(() => {
    if (typeFilter === "chore") {
      if (choreFilter === "all") return typed;
      return typed.filter((t) => (t.scope === "personal" ? t.owner === choreFilter : t.assignee === choreFilter));
    }
    if (typeFilter === "project") {
      let f = typed.filter((t) => t.scope === projectScope);
      if (projectScope === "shared") {
        if (projectFilter !== "all") f = f.filter((t) => t.assignee === projectFilter);
      } else {
        f = f.filter((t) => t.owner === me);
      }
      return f;
    }
    let f = typed;
    if (filter === "mine") f = f.filter((t) => t.owner === me || (t.scope === "shared" && (t.assignee === me || !t.assignee)));
    if (filter === "shared") f = f.filter((t) => t.scope === "shared");
    return f;
  }, [typed, typeFilter, choreFilter, projectScope, projectFilter, filter, me]);

  const sorted = useMemo(() => scoped.slice().sort((a, b) => {
    const ac = a.completed ? 1 : 0, bc = b.completed ? 1 : 0;
    if (ac !== bc) return ac - bc;
    return (a.dueDate || "9999").localeCompare(b.dueDate || "9999");
  }), [scoped]);

  const rowProps = { me, onToggle, onEdit, onDelete, onToggleAction, onAddAction, onDeleteAction, onReorderAction, onSetActionDueDate };

  return (
    <div style={{ height: "calc(100% - 96px)", display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", gap: 6, padding: "10px 16px 0" }}>
        {[["chore", "Chores"], ["project", "Projects"]].map(([k, l]) => (
          <button key={k} onClick={() => setTypeFilter(k)} style={{ padding: "6px 12px", borderRadius: 8, border: `1px solid ${typeFilter === k ? C.ink : C.rule}`, background: typeFilter === k ? C.ink : C.card, color: typeFilter === k ? C.white : C.ink, fontSize: 12, fontWeight: 600, cursor: "pointer", flex: 1 }}>{l}</button>
        ))}
      </div>

      {typeFilter === "chore" && (
        <div style={{ display: "flex", gap: 6, padding: "8px 16px 0" }}>
          {[["all", "All"], ["jade", "Jade"], ["john", "John"]].map(([k, l]) => <FilterChip key={k} active={choreFilter === k} onClick={() => setChoreFilter(k)} label={l} />)}
        </div>
      )}

      {typeFilter === "project" && (
        <>
          <div style={{ display: "flex", gap: 6, padding: "8px 16px 0" }}>
            <button onClick={() => setProjectScope("shared")} style={{ flex: 1, padding: "6px 12px", borderRadius: 8, border: `1px solid ${projectScope === "shared" ? C.ink : C.rule}`, background: projectScope === "shared" ? C.ink : C.card, color: projectScope === "shared" ? C.white : C.ink, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Shared Projects</button>
            <button onClick={() => setProjectScope("personal")} style={{ flex: 1, padding: "6px 12px", borderRadius: 8, border: `1px solid ${projectScope === "personal" ? C.ink : C.rule}`, background: projectScope === "personal" ? C.ink : C.card, color: projectScope === "personal" ? C.white : C.ink, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Personal Projects</button>
          </div>
          {projectScope === "shared" && (
            <div style={{ display: "flex", gap: 6, padding: "8px 16px 0" }}>
              {[["all", "All"], ["jade", "Jade"], ["john", "John"]].map(([k, l]) => <FilterChip key={k} active={projectFilter === k} onClick={() => setProjectFilter(k)} label={l} />)}
            </div>
          )}
        </>
      )}

      {typeFilter === "chore" ? (
        <RoomBoard tasks={sorted} rowProps={rowProps} rooms={withOrphans(config.rooms, sorted, "room")} onAddRoom={onAddRoom} onDeleteRoom={onDeleteRoom} onReorderRoom={onReorderRoom} />
      ) : (
        <CategoryBoard
          tasks={sorted} rowProps={rowProps}
          categories={withOrphans(projectScope === "shared" ? config.sharedCategories : config.personalCategories[me], sorted, "category")}
          onAddCategory={(name) => onAddCategory(projectScope, me, name)}
          onDeleteCategory={(name) => onDeleteCategory(projectScope, me, name)}
          onReorderCategory={(name, dir) => onReorderCategory(projectScope, me, name, dir)}
        />
      )}
    </div>
  );
}

/* horizontally scrolling row with tap-to-scroll arrows — helps when there are many sections */
function ScrollableRow({ children }) {
  const ref = useRef(null);
  const scrollBy = (dir) => { if (ref.current) ref.current.scrollBy({ left: dir * 260, behavior: "smooth" }); };
  return (
    <div style={{ position: "relative", flex: 1, minHeight: 0 }}>
      <div ref={ref} style={{ height: "100%", overflowX: "auto", overflowY: "hidden", padding: "12px 38px 90px", display: "flex", gap: 12 }}>
        {children}
      </div>
      <button onClick={() => scrollBy(-1)} aria-label="Scroll left" style={{ position: "absolute", left: 2, top: "42%", transform: "translateY(-50%)", width: 28, height: 28, borderRadius: "50%", border: "none", background: "rgba(43,42,40,0.55)", color: C.white, fontSize: 15, cursor: "pointer", zIndex: 2 }}>‹</button>
      <button onClick={() => scrollBy(1)} aria-label="Scroll right" style={{ position: "absolute", right: 2, top: "42%", transform: "translateY(-50%)", width: 28, height: 28, borderRadius: "50%", border: "none", background: "rgba(43,42,40,0.55)", color: C.white, fontSize: 15, cursor: "pointer", zIndex: 2 }}>›</button>
    </div>
  );
}
/* two-tap inline confirm — avoids relying on window.confirm(), which can be unreliable in installed PWAs */
function SectionDeleteButton({ onDelete }) {
  const [confirming, setConfirming] = useState(false);
  if (confirming) {
    return (
      <button onClick={() => onDelete()} style={{ border: "none", background: "rgba(255,255,255,0.3)", color: C.white, borderRadius: 5, padding: "1px 7px", fontSize: 10, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>
        Confirm?
      </button>
    );
  }
  return <button onClick={() => setConfirming(true)} style={{ border: "none", background: "none", color: C.white, opacity: 0.7, cursor: "pointer", fontSize: 12, padding: 0 }}>×</button>;
}
function SectionReorderButtons({ onLeft, onRight }) {
  return (
    <div style={{ display: "flex", gap: 2 }}>
      <button onClick={onLeft} style={{ border: "none", background: "none", color: C.white, opacity: 0.7, cursor: "pointer", fontSize: 11, padding: 0 }}>‹</button>
      <button onClick={onRight} style={{ border: "none", background: "none", color: C.white, opacity: 0.7, cursor: "pointer", fontSize: 11, padding: 0 }}>›</button>
    </div>
  );
}

function RoomBoard({ tasks, rowProps, rooms, onAddRoom, onDeleteRoom, onReorderRoom }) {
  return (
    <ScrollableRow>
      {rooms.map((room) => {
        const roomTasks = tasks.filter((t) => (t.room || "Unassigned") === room);
        const deletable = room !== "Unassigned";
        return (
          <div key={room} style={{ minWidth: 240, maxWidth: 240, display: "flex", flexDirection: "column" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, background: C.sageDeep, padding: "6px 10px", borderRadius: 8, marginBottom: 8 }}>
              {deletable && <SectionReorderButtons onLeft={() => onReorderRoom(room, -1)} onRight={() => onReorderRoom(room, 1)} />}
              <div style={{ flex: 1, textAlign: "center", fontFamily: "Fraunces, serif", fontSize: 14, fontWeight: 600, color: C.white }}>
                {room} <span style={{ fontWeight: 400, opacity: 0.8, fontSize: 11 }}>({roomTasks.length})</span>
              </div>
              {deletable && <SectionDeleteButton onDelete={() => onDeleteRoom(room)} />}
            </div>
            <div style={{ overflowY: "auto", flex: 1 }}>
              {roomTasks.length === 0 && <div style={{ color: C.inkSoft, fontSize: 12, textAlign: "center", marginTop: 20 }}>No chores here</div>}
              {roomTasks.map((t) => <TaskRow key={t.id} task={t} {...rowProps} compact />)}
            </div>
          </div>
        );
      })}
      <AddSectionColumn onAdd={onAddRoom} label="room" />
    </ScrollableRow>
  );
}
function CategoryBoard({ tasks, rowProps, categories, onAddCategory, onDeleteCategory, onReorderCategory }) {
  return (
    <ScrollableRow>
      {categories.map((cat) => {
        const catTasks = tasks.filter((t) => (t.category || "Unassigned") === cat);
        const deletable = cat !== "Unassigned";
        return (
          <div key={cat} style={{ minWidth: 240, maxWidth: 240, display: "flex", flexDirection: "column" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, background: C.plum, padding: "6px 10px", borderRadius: 8, marginBottom: 8 }}>
              {deletable && <SectionReorderButtons onLeft={() => onReorderCategory(cat, -1)} onRight={() => onReorderCategory(cat, 1)} />}
              <div style={{ flex: 1, textAlign: "center", fontFamily: "Fraunces, serif", fontSize: 14, fontWeight: 600, color: C.white }}>
                {cat} <span style={{ fontWeight: 400, opacity: 0.8, fontSize: 11 }}>({catTasks.length})</span>
              </div>
              {deletable && <SectionDeleteButton onDelete={() => onDeleteCategory(cat)} />}
            </div>
            <div style={{ overflowY: "auto", flex: 1 }}>
              {catTasks.length === 0 && <div style={{ color: C.inkSoft, fontSize: 12, textAlign: "center", marginTop: 20 }}>No projects here</div>}
              {catTasks.map((t) => <TaskRow key={t.id} task={t} {...rowProps} compact />)}
            </div>
          </div>
        );
      })}
      <AddSectionColumn onAdd={onAddCategory} label="category" />
    </ScrollableRow>
  );
}
function AddSectionColumn({ onAdd, label }) {
  const add = () => {
    const name = window.prompt(`New ${label} name`);
    if (name && name.trim()) onAdd(name.trim());
  };
  return (
    <div style={{ minWidth: 90, display: "flex", alignItems: "flex-start", paddingTop: 30 }}>
      <button onClick={add} style={{ border: `1px dashed ${C.rule}`, background: "transparent", color: C.inkSoft, borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontSize: 12, whiteSpace: "nowrap" }}>+ Add section</button>
    </div>
  );
}

function TaskRow({ task, me, onToggle, onEdit, onDelete, onToggleAction, onAddAction, onDeleteAction, onReorderAction, onSetActionDueDate, compact, onSnooze, onAddToToday }) {
  const [open, setOpen] = useState(false);
  const [newAction, setNewAction] = useState("");
  const imp = IMPORTANCE.find((x) => x.key === task.priority) || null;
  const todayStr = new Date().toISOString().slice(0, 10);
  const overdue = task.dueDate && task.dueDate < todayStr && !task.completed;
  const notYetAvailable = task.startsOnDue && task.dueDate && task.dueDate > todayStr && !task.completed;
  const na = nextAction(task);
  const progress = actionsProgress(task);
  const badgePerson = task.scope === "personal" ? task.owner : task.assignee;
  const commit = () => { if (newAction.trim()) { onAddAction(task.id, newAction); setNewAction(""); } };
  const del = (e) => { e.stopPropagation(); if (window.confirm(`Delete "${task.title}"?`)) onDelete(task.id); };

  return (
    <div style={{ background: C.card, border: `1px solid ${C.rule}`, borderRadius: 10, padding: compact ? "9px 10px" : "11px 12px", marginBottom: 8, opacity: task.completed ? 0.55 : (notYetAvailable ? 0.5 : 1) }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
        <button onClick={() => onToggle(task)} disabled={notYetAvailable} style={{ width: 20, height: 20, borderRadius: "50%", border: `2px solid ${imp ? imp.color : C.inkSoft}`, background: task.completed ? (imp ? imp.color : C.inkSoft) : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: notYetAvailable ? "default" : "pointer", flexShrink: 0, marginTop: 1, color: C.white, fontSize: 11 }}>
          {task.completed && "✓"}
        </button>
        <div style={{ flex: 1, minWidth: 0 }} onClick={() => onEdit(task)}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <PersonBadge person={badgePerson} size={compact ? 16 : 18} />
            <div style={{ fontSize: compact ? 13 : 14, color: C.ink, fontWeight: 600, textDecoration: task.completed ? "line-through" : "none" }}>{task.title}</div>
          </div>
          {!compact && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 5, alignItems: "center" }}>
              {notYetAvailable && <Tag color={C.inkSoft}>Not yet — {fmtDate(task.dueDate)}</Tag>}
              {imp && <Tag color={imp.color}>{imp.label}</Tag>}
              {task.priorityBucket && <Tag color={C.mustard}>{BUCKETS.find((b) => b.key === task.priorityBucket)?.label}</Tag>}
              {task.room && <MetaTag>{task.room}</MetaTag>}
              {task.category && <MetaTag>{task.category}</MetaTag>}
              {recurrenceLabel(task.recurrence) && <MetaTag>↻ {recurrenceLabel(task.recurrence)}</MetaTag>}
              {task.dueDate && !notYetAvailable && <span style={{ fontSize: 10.5, fontFamily: "IBM Plex Mono, monospace", color: overdue ? C.plum : C.inkSoft, fontWeight: overdue ? 700 : 500 }}>{fmtDate(task.dueDate)}</span>}
            </div>
          )}
          {compact && task.dueDate && <div style={{ fontSize: 10, fontFamily: "IBM Plex Mono, monospace", color: overdue ? C.plum : C.inkSoft, marginTop: 3 }}>{notYetAvailable ? `Not yet — ${fmtDate(task.dueDate)}` : fmtDate(task.dueDate)}</div>}
        </div>
        {onAddToToday && <button onClick={(e) => { e.stopPropagation(); onAddToToday(task.id); }} style={{ border: `1px solid ${C.rule}`, background: C.white, color: C.sageDeep, cursor: "pointer", padding: "2px 8px", fontSize: 11, fontWeight: 600, borderRadius: 6, whiteSpace: "nowrap" }}>+ Today</button>}
        <button onClick={del} style={{ border: "none", background: "none", color: C.inkSoft, cursor: "pointer", padding: 2, fontSize: compact ? 11 : 13 }}>🗑</button>
      </div>

      {task.notes && !compact && <div style={{ marginLeft: 30, marginTop: 5, fontSize: 11.5, color: C.inkSoft, fontStyle: "italic" }}>{task.notes}</div>}
      {onSnooze && <div style={{ marginLeft: 30, marginTop: 6 }}><SnoozeControl onSnooze={onSnooze} /></div>}

      <div style={{ marginLeft: 30, marginTop: 6 }}>
        {na ? (
          <button onClick={() => onToggleAction(task.id, na.id)} style={{ display: "flex", alignItems: "flex-start", gap: 6, border: "none", background: "none", padding: 0, cursor: "pointer", textAlign: "left" }}>
            <span style={{ width: 11, height: 11, borderRadius: "50%", border: `1.5px solid ${C.sageDeep}`, marginTop: 2, flexShrink: 0 }} />
            <span style={{ fontSize: compact ? 11 : 12, color: C.sageDeep, fontStyle: "italic", lineHeight: 1.3 }}>Next: {na.title}{na.dueDate ? ` · ${fmtDate(na.dueDate)}` : ""}</span>
          </button>
        ) : progress ? <span style={{ fontSize: 11, color: C.inkSoft }}>All actions done</span> : null}
        {progress && (
          <button onClick={() => setOpen((o) => !o)} style={{ border: "none", background: "none", color: C.inkSoft, fontSize: 10.5, cursor: "pointer", padding: 0, marginLeft: na ? 8 : 0 }}>{progress} {open ? "▴" : "▾"}</button>
        )}
      </div>

      {open && (
        <div style={{ marginLeft: 30, marginTop: 8, borderTop: `1px dashed ${C.rule}`, paddingTop: 8 }}>
          {(task.actions || []).map((a, idx) => (
            <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 6, flexWrap: "wrap" }}>
              <button onClick={() => onToggleAction(task.id, a.id)} style={{ width: 15, height: 15, borderRadius: 4, border: `1.5px solid ${C.sageDeep}`, background: a.completed ? C.sageDeep : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, color: C.white, fontSize: 9 }}>{a.completed && "✓"}</button>
              <span style={{ fontSize: 12, color: C.ink, textDecoration: a.completed ? "line-through" : "none", flex: 1, minWidth: 60 }}>{a.title}</span>
              <input type="date" value={a.dueDate || ""} onChange={(e) => onSetActionDueDate(task.id, a.id, e.target.value)} style={{ fontSize: 10, border: `1px solid ${C.rule}`, borderRadius: 5, padding: "2px 4px", color: C.inkSoft, width: 108 }} />
              <button onClick={() => onReorderAction(task.id, a.id, -1)} disabled={idx === 0} style={{ border: "none", background: "none", color: idx === 0 ? C.rule : C.inkSoft, cursor: idx === 0 ? "default" : "pointer", padding: "0 2px", fontSize: 11 }}>▲</button>
              <button onClick={() => onReorderAction(task.id, a.id, 1)} disabled={idx === (task.actions || []).length - 1} style={{ border: "none", background: "none", color: idx === (task.actions || []).length - 1 ? C.rule : C.inkSoft, cursor: "pointer", padding: "0 2px", fontSize: 11 }}>▼</button>
              <button onClick={() => onDeleteAction(task.id, a.id)} style={{ border: "none", background: "none", color: C.inkSoft, cursor: "pointer", padding: 0, fontSize: 12 }}>×</button>
            </div>
          ))}
          <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
            <input value={newAction} onChange={(e) => setNewAction(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") commit(); }} onBlur={commit} placeholder="Add an action…" style={{ ...inputStyle, padding: "6px 9px", fontSize: 12 }} />
            <button onClick={commit} style={{ border: "none", background: C.sageDeep, color: C.white, borderRadius: 6, padding: "0 10px", cursor: "pointer" }}>+</button>
          </div>
        </div>
      )}
    </div>
  );
}
function Tag({ color, children }) { return <span style={{ fontSize: 10, color: C.white, background: color, padding: "2px 7px", borderRadius: 20, display: "inline-flex", alignItems: "center" }}>{children}</span>; }
function MetaTag({ children }) { return <span style={{ fontSize: 10, color: C.inkSoft, background: "#EAE4D6", padding: "2px 7px", borderRadius: 20, display: "inline-flex", alignItems: "center" }}>{children}</span>; }

/* matches the plain Chores/Projects section heading style, but collapsible (closed by default) */
function CollapsibleSection({ title, count, defaultOpen, children }) {
  const [open, setOpen] = useState(!!defaultOpen);
  return (
    <div style={{ marginBottom: 14 }}>
      <button onClick={() => setOpen((o) => !o)} style={{ display: "flex", alignItems: "center", gap: 6, width: "100%", background: "none", border: "none", padding: 0, cursor: "pointer", marginBottom: open ? 6 : 0 }}>
        <span style={{ fontSize: 11, color: C.inkSoft, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5 }}>{title}{count != null ? ` (${count})` : ""}</span>
        <span style={{ color: C.inkSoft, fontSize: 10 }}>{open ? "▴" : "▾"}</span>
      </button>
      {open && children}
    </div>
  );
}

/* ---------- overlay ---------- */
function Overlay({ title, onClose, children }) {
  return (
    <div style={{ position: "absolute", inset: 0, background: "rgba(43,42,40,0.4)", display: "flex", alignItems: "flex-end", zIndex: 10 }} onClick={onClose}>
      <div style={{ background: C.parchment, width: "100%", maxHeight: "80%", borderRadius: "18px 18px 0 0", padding: 18, overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontFamily: "Fraunces, serif", fontSize: 18, fontWeight: 600, color: C.ink }}>{title}</div>
          <button onClick={onClose} style={{ border: "none", background: "none", cursor: "pointer", color: C.inkSoft, fontSize: 20 }}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ---------- reusable section (room/category) picker with inline "add new" ---------- */
function SectionSelect({ value, onChange, options, onAddNew }) {
  const [adding, setAdding] = useState(false);
  const [name, setName] = useState("");
  const commit = () => {
    if (name.trim()) { onAddNew(name.trim()); onChange(name.trim()); }
    setAdding(false); setName("");
  };
  if (adding) {
    return (
      <div style={{ display: "flex", gap: 6 }}>
        <input autoFocus autoComplete="off" value={name} onChange={(e) => setName(e.target.value)} placeholder="New section name" style={inputStyle} onKeyDown={(e) => { if (e.key === "Enter") commit(); }} onBlur={commit} />
        <button onClick={commit} style={{ border: "none", background: C.sageDeep, color: C.white, borderRadius: 8, padding: "0 12px", cursor: "pointer" }}>Add</button>
      </div>
    );
  }
  return (
    <select value={value} onChange={(e) => { if (e.target.value === "__new__") setAdding(true); else onChange(e.target.value); }} style={inputStyle}>
      {(value && !options.includes(value) ? [value, ...options] : options).map((o) => <option key={o} value={o}>{o}</option>)}
      <option value="__new__">+ Add new…</option>
    </select>
  );
}

function TaskForm({ me, initial, config, onAddRoom, onAddCategory, onClose, onSave, onDelete }) {
  const [t, setT] = useState(() => {
    const base = initial || {
      id: uid(), title: "", listType: "chore", scope: "shared", owner: me,
      room: DEFAULT_ROOMS[0], category: DEFAULT_CATEGORIES[0], assignee: null,
      priority: null, priorityBucket: null,
      dueDate: null, recurrence: { unit: "none", amount: 1, mode: "rolling" }, notes: "",
      completed: false, gridBucket: {}, actions: [],
      needsDetails: false, createdBy: me, startsOnDue: false, createdAt: Date.now(), completedAt: null,
    };
    return { ...base, recurrence: normRecurrence(base.recurrence) };
  });
  const [deferDetails, setDeferDetails] = useState(false);
  const set = (k, v) => setT((p) => ({ ...p, [k]: v }));
  const [newAction, setNewAction] = useState("");
  const addFormAction = () => {
    if (!newAction.trim()) return;
    set("actions", [...(t.actions || []), { id: uid(), title: newAction.trim(), completed: false, dueDate: null }]);
    setNewAction("");
  };
  const removeFormAction = (id) => set("actions", (t.actions || []).filter((a) => a.id !== id));
  const toggleFormAction = (id) => set("actions", (t.actions || []).map((a) => (a.id === id ? { ...a, completed: !a.completed } : a)));
  const reorderFormAction = (id, dir) => {
    const idx = (t.actions || []).findIndex((a) => a.id === id);
    if (idx < 0) return;
    set("actions", moveAction(t.actions || [], idx, dir));
  };
  const setFormActionDate = (id, date) => set("actions", (t.actions || []).map((a) => (a.id === id ? { ...a, dueDate: date || null } : a)));

  const categoryOptions = t.scope === "shared" ? config.sharedCategories : config.personalCategories[t.owner || me];
  const showAssignee = t.scope === "shared";
  const isValid = t.title.trim() && (deferDetails || (t.listType === "chore" ? !!t.room : !!t.category));

  const finishAndSave = () => {
    const finalActions = newAction.trim() ? [...(t.actions || []), { id: uid(), title: newAction.trim(), completed: false, dueDate: null }] : (t.actions || []);
    const detailsOk = deferDetails || (t.listType === "chore" ? t.room : t.category);
    if (t.title.trim() && detailsOk) {
      onSave({
        ...t, actions: finalActions,
        owner: t.scope === "personal" ? (t.owner || me) : null,
        needsDetails: deferDetails, createdBy: t.createdBy || me,
      });
    } else {
      onClose();
    }
  };

  return (
    <Overlay title={initial ? "Edit task" : "New task"} onClose={finishAndSave}>
      <Field label="Title *"><input value={t.title} onChange={(e) => set("title", e.target.value)} placeholder="e.g. Clean shower screen" style={inputStyle} /></Field>

      {!initial && (
        <div style={{ display: "flex", alignItems: "flex-start", gap: 9, marginBottom: 15, padding: "9px 11px", background: C.card, borderRadius: 8, border: `1px solid ${C.rule}` }}>
          <input type="checkbox" id="defer-details" checked={deferDetails} onChange={(e) => setDeferDetails(e.target.checked)} style={{ marginTop: 2 }} />
          <label htmlFor="defer-details" style={{ fontSize: 12, color: C.inkSoft, lineHeight: 1.4 }}>Add details later</label>
        </div>
      )}

      {!deferDetails && (
        <>
          <Field label="Type *"><SegRow options={[["chore", "Chore"], ["project", "Project"]]} value={t.listType} onChange={(v) => set("listType", v)} /></Field>
          <Field label="Belongs to *"><SegRow options={[["shared", "Shared"], ["personal", "Personal"]]} value={t.scope} onChange={(v) => set("scope", v)} /></Field>

          {t.listType === "chore" ? (
            <Field label="Room *"><SectionSelect value={t.room} onChange={(v) => set("room", v)} options={config.rooms} onAddNew={onAddRoom} /></Field>
          ) : (
            <Field label="Category *"><SectionSelect value={t.category} onChange={(v) => set("category", v)} options={categoryOptions} onAddNew={(name) => onAddCategory(t.scope, t.owner || me, name)} /></Field>
          )}

          {showAssignee && <Field label="Assign to"><SegRow options={[[null, "Anyone"], ["jade", "Jade"], ["john", "John"]]} value={t.assignee} onChange={(v) => set("assignee", v)} /></Field>}
        </>
      )}

      <Field label="Importance"><SegRow options={[[null, "None"], ...IMPORTANCE.map((p) => [p.key, p.label])]} value={t.priority} onChange={(v) => set("priority", v)} /></Field>

      {t.listType === "project" && (
        <Field label="Priorities (doesn't pin automatically)"><SegRow options={[[null, "None"], ...BUCKETS.map((b) => [b.key, b.label])]} value={t.priorityBucket} onChange={(v) => set("priorityBucket", v)} /></Field>
      )}

      <Field label="Due date"><input type="date" value={t.dueDate || ""} onChange={(e) => set("dueDate", e.target.value || null)} style={inputStyle} /></Field>
      {t.dueDate && (
        <div style={{ display: "flex", alignItems: "flex-start", gap: 9, marginBottom: 15, padding: "9px 11px", background: C.card, borderRadius: 8, border: `1px solid ${C.rule}` }}>
          <input type="checkbox" id="starts-on-due" checked={!!t.startsOnDue} onChange={(e) => set("startsOnDue", e.target.checked)} style={{ marginTop: 2 }} />
          <label htmlFor="starts-on-due" style={{ fontSize: 12, color: C.inkSoft, lineHeight: 1.4 }}>Due date is start date</label>
        </div>
      )}
      <Field label="Repeats"><SegRow options={RECUR_UNITS} value={t.recurrence.unit} onChange={(v) => set("recurrence", { ...t.recurrence, unit: v })} /></Field>
      {t.recurrence.unit !== "none" && (
        <>
          <Field label={`Every (${t.recurrence.unit}s)`}>
            <input type="number" min="1" value={t.recurrence.amount} onChange={(e) => set("recurrence", { ...t.recurrence, amount: Math.max(1, parseInt(e.target.value, 10) || 1) })} style={{ ...inputStyle, width: 90 }} />
          </Field>
          <Field label="When completed">
            <SegRow options={[["rolling", "Restart timer from completion"], ["fixed", "Stick to the schedule"]]} value={t.recurrence.mode} onChange={(v) => set("recurrence", { ...t.recurrence, mode: v })} />
          </Field>
        </>
      )}
      <Field label="Notes"><textarea value={t.notes || ""} onChange={(e) => set("notes", e.target.value)} rows={3} placeholder="Any extra context…" style={{ ...inputStyle, resize: "vertical", fontFamily: "inherit" }} /></Field>

      <Field label="Actions">
        {(t.actions || []).map((a, idx) => (
          <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 7, flexWrap: "wrap" }}>
            <button onClick={() => toggleFormAction(a.id)} style={{ width: 15, height: 15, borderRadius: 4, border: `1.5px solid ${C.sageDeep}`, background: a.completed ? C.sageDeep : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, color: C.white, fontSize: 9 }}>{a.completed && "✓"}</button>
            <span style={{ fontSize: 13, color: C.ink, flex: 1, minWidth: 60, textDecoration: a.completed ? "line-through" : "none" }}>{a.title}</span>
            <input type="date" value={a.dueDate || ""} onChange={(e) => setFormActionDate(a.id, e.target.value)} style={{ fontSize: 10, border: `1px solid ${C.rule}`, borderRadius: 5, padding: "3px 5px", color: C.inkSoft, width: 112 }} />
            <button onClick={() => reorderFormAction(a.id, -1)} disabled={idx === 0} style={{ border: "none", background: "none", color: idx === 0 ? C.rule : C.inkSoft, cursor: "pointer", fontSize: 11 }}>▲</button>
            <button onClick={() => reorderFormAction(a.id, 1)} disabled={idx === (t.actions || []).length - 1} style={{ border: "none", background: "none", color: idx === (t.actions || []).length - 1 ? C.rule : C.inkSoft, cursor: "pointer", fontSize: 11 }}>▼</button>
            <button onClick={() => removeFormAction(a.id)} style={{ border: "none", background: "none", color: C.inkSoft, cursor: "pointer" }}>×</button>
          </div>
        ))}
        <div style={{ display: "flex", gap: 6 }}>
          <input value={newAction} onChange={(e) => setNewAction(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addFormAction(); } }} onBlur={addFormAction} placeholder="e.g. Buy grout" style={{ ...inputStyle, fontSize: 13 }} />
          <button onClick={addFormAction} style={{ border: "none", background: C.sageDeep, color: C.white, borderRadius: 8, padding: "0 12px", cursor: "pointer" }}>+</button>
        </div>
      </Field>

      <button disabled={!isValid} onClick={finishAndSave} style={{ ...btnStyle(C.ink), width: "100%", marginTop: 8, opacity: isValid ? 1 : 0.5 }}>Save</button>
      {initial && (
        <button
          onClick={() => { if (window.confirm(`Delete "${t.title}"? This can't be undone.`)) onDelete(t.id); }}
          style={{ width: "100%", marginTop: 8, padding: "10px 0", borderRadius: 10, border: `1px solid ${C.plum}`, background: "transparent", color: C.plum, fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}
        >
          Delete task
        </button>
      )}
    </Overlay>
  );
}
function Field({ label, children }) { return <div style={{ marginBottom: 13 }}><div style={{ fontSize: 11, color: C.inkSoft, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 5 }}>{label}</div>{children}</div>; }
const inputStyle = { width: "100%", padding: "10px 11px", borderRadius: 8, border: `1px solid ${C.rule}`, background: C.white, fontSize: 14, color: C.ink, outline: "none" };
function SegRow({ options, value, onChange }) {
  return <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>{options.map(([val, label]) => (
    <button key={String(val)} onClick={() => onChange(val)} style={{ padding: "7px 13px", borderRadius: 8, border: `1px solid ${value === val ? C.ink : C.rule}`, background: value === val ? C.ink : C.white, color: value === val ? C.white : C.ink, fontSize: 12.5, cursor: "pointer" }}>{label}</button>
  ))}</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

  const sourceCode = document.getElementById("app-source").textContent;
  const compiled = Babel.transform(sourceCode, { presets: [["react", { runtime: "classic" }]] }).code;
  const runnable = document.createElement("script");
  runnable.textContent = compiled;
  document.body.appendChild(runnable);

</body>
